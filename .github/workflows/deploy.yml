name: FACEIT Webhook · tests y deploy Cloudflare Worker
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: faceit-webhook-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis
        run: |
          node --check src/index.js
          node --check src/vants-bus-faceit.js
          node --check src/vants-bus-client.js
      - name: Deploy Worker vants-faceit-webhook a Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Configura CLOUDFLARE_API_TOKEN en VANTSGAMES/vants-faceit-webhook para auto-deploy."
            exit 0
          fi
          npx -y wrangler@4 deploy
          sleep 4
          curl -fsS https://vants-faceit-webhook.vants.workers.dev/healthz
